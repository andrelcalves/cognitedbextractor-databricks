version: 1
type: local

logger:
  console:
    level: DEBUG

  file:
    level: DEBUG
    path: "./dbextractor.log"
    retention: 7

cognite:
  host: "https://az-phx-001.cognitedata.com"
  project: "bdx-dev"
  timeout: 3000

  idp-authentication:
    authority: "https://login.microsoftonline.com/"
    tenant: ""
    client-id: ""
    secret: ""
    scopes:
      - "https://az-phx-001.cognitedata.com/.default"

  connection:
    disable-ssl: true

  data-set:
    external-id: 'ds_databricks_jde_in_dat'

  extraction-pipeline:
    external-id: 'ep_databricks_jde_in_dbExtractor'

databases:
  - type: "odbc"
    name: "db-databricks-raw"
    connection-string:
      Driver={Databricks ODBC Driver};
      Host=;
      Port=443;
      HTTPPath=;
      SSL=1;
      ThriftTransport=2;
      AuthMech=3;
      UID=token;
      PWD=

queries:
# SALES ORDER TABLES

# PK uses SD* columns (view schema from NA smoke test; classic ledger prefix is SL)
# F42119 - Sales Order Detail Ledger
  - name: "extract-jdein-F42119"
    database: "db-databricks-raw"
    query: >
      SELECT CONCAT(SDDOCO, '_', SDDCTO, '_', SDKCOO, '_', SDLNID) AS F42119_PK, *
      FROM hub_dev.g_external.v_cognite_f42119_jdeint
      WHERE coalesce(
              try_to_timestamp(DATETIMESTAMP, 'yyyy-MM-dd HH:mm:ss.SSSSSS'),
              try_to_timestamp(DATETIMESTAMP, 'yyyy-MM-dd HH:mm:ss')
            ) >= current_timestamp() - INTERVAL 1 YEAR
      LIMIT 10
    destination:
      type: "raw"
      database: "db_databricks_jde_in_raw"
      table: "tb_F42119"

    primary-key: "{F42119_PK}"

# END SALES ORDER TABLES

