version: 1
type: local

logger:
  console:
    level: DEBUG

  file:
    level: DEBUG
    path: "./dbextractor.log"
    retention: 7

cognite:
  host: "https://az-phx-001.cognitedata.com"
  project: "bdx-dev"
  timeout: 3000

  idp-authentication:
    authority: "https://login.microsoftonline.com/"
    tenant: ""
    client-id: ""
    secret: ""
    scopes:
      - "https://az-phx-001.cognitedata.com/.default"

  connection:
    disable-ssl: true
 
  data-set:
    external-id: 'ds_databricks_everest_dat'

  extraction-pipeline:
    external-id: 'ep_databricks_everest_dbExtractor'

databases:
  - type: "odbc"
    name: "db-databricks-raw"
    connection-string:
      Driver={Databricks ODBC Driver};
      Host=;
      Port=443;
      HTTPPath=;
      SSL=1;
      ThriftTransport=2;
      AuthMech=3;
      UID=token;
      PWD=

queries:

# PRODUCTION ORDERS & CONFIRMATIONS (PP/PM)
 # AFFW - Goods Movements with Errors from Confirmations
  - name: "extract-everest-AFFW"
    database: "db-databricks-raw"
    query: >
      SELECT CONCAT(MANDT, '_', WEBLNR, '_', WEBLPOS) AS AFFW_PK, *
      FROM hub_dev.g_external.v_cognite_affw_everest
      WHERE coalesce(
              try_to_timestamp(DATETIMESTAMP, 'yyyy-MM-dd HH:mm:ss.SSSSSS'),
              try_to_timestamp(DATETIMESTAMP, 'yyyy-MM-dd HH:mm:ss')
            ) >= current_timestamp() - INTERVAL 1 YEAR
    destination:
      type: "raw"
      database: "db_databricks_everest_raw"
      table: "tb_AFFW"

    primary-key: "{AFFW_PK}"
