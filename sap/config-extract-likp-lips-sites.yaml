version: 1
type: local

logger:
  console:
    level: DEBUG

  file:
    level: DEBUG
    path: "./dbextractor.log"
    retention: 7

cognite:
  host: "https://az-phx-001.cognitedata.com"
  project: "bdx-dev"
  timeout: 3000

  idp-authentication:
    authority: "https://login.microsoftonline.com/"
    tenant: ""
    client-id: ""
    secret: ""
    scopes:
      - "https://az-phx-001.cognitedata.com/.default"

  connection:
    disable-ssl: true

  data-set:
    external-id: 'ds_databricks_everest_dat'

  extraction-pipeline:
    external-id: 'ep_databricks_everest_dbExtractor_likp_lips_sites'

extractor:
  mode: continuous
  parallelism: 1
  upload-queue-size: 50000
  state-store:
    raw:
      database: db_extractor_state
      table: everest_extract_likp_lips_sites

databases:
  - type: "odbc"
    name: "db-databricks-raw"
    connection-string: 
      Driver={Databricks ODBC Driver};
      Host=;
      Port=443;
      HTTPPath=;
      SSL=1;
      ThriftTransport=2;
      AuthMech=3;
      UID=token;
      PWD= 

queries:

# LIKP + LIPS and VBAK + VBAP for 9 sites.
# Source catalog: hub_dev. Site list: 1024, 1325, 1100, 1326, 1215, 1327, 1441, 1442, 1324.
# LIPS is one RAW table per site, in the site RAW database (red, pla, oak, cov, elp).
# LIKP is one RAW table for all 9 sites: tb_LikpEverest_fltd in db_databricks_glb_raw.
# VBAP is one RAW table per site, in the site RAW database (red, pla, oak, cov, elp).
# VBAK is one RAW table for all 9 sites: tb_VbakEverest_fltd in db_databricks_glb_raw.
# initial-start is the DATETIMESTAMP watermark. The 3-year cut is the ERDAT predicate.
# Measured on 2026-10-22: LIPS 8,237,347 item rows, LIKP 3,100,865 headers (header ERDAT in the window).
# This file does not replace config-extract-1 (LIKP) or config-extract-3 (LIPS).

# LIPS site 1442 [3-year items: 74,908]
  - name: "extract-everest-LIPS-1442"
    database: "db-databricks-raw"
    query: >
      SELECT
        sha2(
          replace(replace(replace(replace(replace(
            to_json(
              map_from_entries(
                array_sort(
                  map_entries(
                    from_json(
                      to_json(struct(*), map('ignoreNullFields', 'false')),
                      'MAP<STRING, VARIANT>'
                    )
                  ),
                  (l, r) -> CASE
                    WHEN l.key < r.key THEN -1
                    WHEN l.key > r.key THEN 1
                    ELSE 0
                  END
                )
              ),
              map('ignoreNullFields', 'false')
            ),
            '&', '\\u0026'),
            '<', '\\u003c'),
            '>', '\\u003e'),
            chr(8232), '\\u2028'),
            chr(8233), '\\u2029'
          ),
          256
        ) AS key,
        *
      FROM hub_dev.g_external.v_cognite_lips_everest
      WHERE {incremental_field} >= '{start_at}'
        AND TRIM(CAST(WERKS AS STRING)) = '1442'
        AND (
          CASE
            WHEN CAST(ERDAT AS STRING) RLIKE '^[0-9]{{8}}$' AND CAST(ERDAT AS STRING) NOT LIKE '0000%'
              THEN to_date(CAST(ERDAT AS STRING), 'yyyyMMdd')
            WHEN CAST(ERDAT AS STRING) RLIKE '^[0-9]{{4}}-[0-9]{{2}}-[0-9]{{2}}'
              THEN to_date(substr(CAST(ERDAT AS STRING), 1, 10))
            ELSE NULL
          END
        ) >= DATE '2023-10-22'
      ORDER BY {incremental_field} ASC
    incremental-field: DATETIMESTAMP
    initial-start: "2020-01-01 00:00:00"
    schedule:
      type: interval
      expression: 15m
    destination:
      type: "raw"
      database: "db_databricks_cov_raw"
      table: "tb_LipsEverest_1442"
    primary-key: "{key}"

