version: 1
type: local

logger:
  console:
    level: DEBUG

  file:
    level: DEBUG
    path: "./dbextractor.log"
    retention: 7

cognite:
  host: "https://az-phx-001.cognitedata.com"
  project: "bdx-dev"
  timeout: 3000

  idp-authentication:
    authority: "https://login.microsoftonline.com/"
    tenant: ""
    client-id: ""
    secret: ""
    scopes:
      - "https://az-phx-001.cognitedata.com/.default"

  connection:
    disable-ssl: true

  data-set:
    external-id: 'ds_databricks_everest_dat'

  extraction-pipeline:
    external-id: 'ep_databricks_everest_dbExtractor_2'

extractor:
  mode: continuous
  parallelism: 1
  upload-queue-size: 50000
  state-store:
    raw:
      database: db_extractor_state
      table: everest_extract_2

databases:
  - type: "odbc"
    name: "db-databricks-raw"
    connection-string: 
      Driver={Databricks ODBC Driver};
      Host=;
      Port=443;
      HTTPPath=;
      SSL=1;
      ThriftTransport=2;
      AuthMech=3;
      UID=token;
      PWD= 

queries:

# === TIER 1 ===

# TVSB - Shipping Conditions [TIER 1 | 18 linhas]
  - name: "extract-everest-TVSB"
    database: "db-databricks-raw"
    query: >
      SELECT sha2(concat_ws('_', MANDT, VSBED), 256) AS key, *
      FROM hub_dev.g_external.v_cognite_tvsb_everest
      WHERE {incremental_field} >= '{start_at}'
      ORDER BY {incremental_field} ASC
    incremental-field: DATETIMESTAMP
    initial-start: "2026-08-01 00:00:00"
    schedule:
      type: interval
      expression: 15m
    destination:
      type: "raw"
      database: "db_databricks_glb_raw"
      table: "tb_TvsbEverest"
    primary-key: "{key}"

