version: 1
type: local

logger:
  console:
    level: DEBUG

  file:
    level: DEBUG
    path: "./dbextractor.log"
    retention: 7

cognite:
  host: "https://az-phx-001.cognitedata.com"
  project: "bdx-dev"
  timeout: 3000

  idp-authentication:
    authority: "https://login.microsoftonline.com/"
    tenant: ""
    client-id: ""
    secret: ""
    scopes:
      - "https://az-phx-001.cognitedata.com/.default"

  connection:
    disable-ssl: true

  data-set:
    external-id: 'ds_databricks_everest_dat'

  extraction-pipeline:
    external-id: 'ep_databricks_everest_dbExtractor_3'

extractor:
  mode: continuous
  parallelism: 1
  upload-queue-size: 50000
  state-store:
    raw:
      database: db_extractor_state
      table: everest_extract_3

databases:
  - type: "odbc"
    name: "db-databricks-raw"
    connection-string: 
      Driver={Databricks ODBC Driver};
      Host=;
      Port=443;
      HTTPPath=;
      SSL=1;
      ThriftTransport=2;
      AuthMech=3;
      UID=token;
      PWD= 

queries:

# === TIER 1 ===

# TPST - Link Between Functional Location and BOM [TIER 1 | 39 linhas]
  - name: "extract-everest-TPST"
    database: "db-databricks-raw"
    query: >
      SELECT
        sha2(
          replace(replace(replace(replace(replace(
            to_json(
              map_from_entries(
                array_sort(
                  map_entries(
                    from_json(
                      to_json(struct(*), map('ignoreNullFields', 'false')),
                      'MAP<STRING, VARIANT>'
                    )
                  ),
                  (l, r) -> CASE
                    WHEN l.key < r.key THEN -1
                    WHEN l.key > r.key THEN 1
                    ELSE 0
                  END
                )
              ),
              map('ignoreNullFields', 'false')
            ),
            '&', '\\u0026'),
            '<', '\\u003c'),
            '>', '\\u003e'),
            chr(8232), '\\u2028'),
            chr(8233), '\\u2029'
          ),
          256
        ) AS key,
        *
      FROM hub_dev.g_external.v_cognite_tpst_everest
      WHERE {incremental_field} >= '{start_at}'
      ORDER BY {incremental_field} ASC
    incremental-field: DATETIMESTAMP
    initial-start: "2026-08-01 00:00:00"
    schedule:
      type: interval
      expression: 15m
    destination:
      type: "raw"
      database: "db_databricks_glb_raw"
      table: "tb_TpstEverest"
    primary-key: "{key}"

